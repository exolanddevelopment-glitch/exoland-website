<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Exotic Land Development</title>
<meta name="description" content="Exotic Land Development — pengelolaan tanah dan properti.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23163d31'/%3E%3Cpath d='M8 15l8-7 8 7v9H8z' fill='none' stroke='%23fff' stroke-width='2.4' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* Quiet one-screen company page: name, one line of what the company does, a small login link in the corner. */
  :root {
    --bg:#10261f; --bg-2:#163d31; --fg:#eef4f1; --muted:#a9c1b7; --line:rgba(238,244,241,.16); --accent:#d9b56a;
    --display:"Fraunces", Georgia, "Times New Roman", serif; --body:"Inter", system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  }
  * { box-sizing:border-box; }
  html, body { height:100%; }
  body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.6 var(--body); }
  .page { min-height:100%; display:grid; grid-template-rows:auto 1fr auto; padding-inline:clamp(16px, 5vw, 64px);
    background:
      radial-gradient(1200px 600px at 85% -10%, rgba(217,181,106,.10), transparent 60%),
      linear-gradient(180deg, var(--bg-2) 0%, var(--bg) 70%); }
  header { display:flex; justify-content:space-between; align-items:center; padding-block:22px; gap:16px; }
  .mark { display:flex; align-items:center; gap:10px; font-weight:600; letter-spacing:.02em; font-size:14px; color:var(--muted); }
  .mark svg { width:30px; height:30px; flex:none; }
  .login { color:var(--fg); text-decoration:none; font-size:14px; font-weight:500; border:1px solid var(--line); border-radius:999px; padding:8px 16px; display:inline-flex; align-items:center; gap:8px; }
  .login:hover { border-color:var(--accent); color:var(--accent); }
  .login:focus-visible { outline:2px solid var(--accent); outline-offset:3px; }
  main { display:flex; flex-direction:column; justify-content:center; padding-block:48px; max-width:900px; }
  .eyebrow { text-transform:uppercase; letter-spacing:.18em; font-size:12px; color:var(--accent); margin:0 0 18px; }
  h1 { font-family:var(--display); font-weight:500; font-size:clamp(40px, 8vw, 88px); line-height:1.02; margin:0 0 22px; text-wrap:balance; }
  .lead { font-size:clamp(17px, 2.2vw, 20px); color:var(--muted); max-width:34em; margin:0; }
  .rule { width:64px; height:2px; background:var(--accent); margin:34px 0 0; border:0; }
  footer { border-top:1px solid var(--line); padding-block:20px; font-size:13px; color:var(--muted); display:flex; justify-content:space-between; flex-wrap:wrap; gap:8px; }
</style>
</head>
<body>
<div class="page">
  <header>
    <div class="mark">
      <svg viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="7" fill="#d9b56a"/><path d="M8 15l8-7 8 7v9H8z" fill="none" stroke="#10261f" stroke-width="2.4" stroke-linejoin="round"/></svg>
      EXOTIC LAND
    </div>
    <a class="login" href="/admin/">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
      Masuk
    </a>
  </header>
  <main>
    <p class="eyebrow">Tanah &amp; Properti</p>
    <h1>Exotic Land Development</h1>
    <p class="lead">Pengelolaan dan pengembangan tanah serta properti sewa, dari kota hingga desa.</p>
    <hr class="rule">
  </main>
  <footer>
    <span>© <span id="yr">2026</span> Exotic Land Development</span>
    <span>exoticlanddevelopment.com</span>
  </footer>
</div>
<script>document.getElementById('yr').textContent = new Date().getFullYear();</script>
</body>
</html>
